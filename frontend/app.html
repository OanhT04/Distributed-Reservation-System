<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Reservations</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <h1><a href="/">Restaurant Reservations</a></h1>
    <p>Browse, book, and manage your table reservations</p>
  </header>

  <nav class="app-nav">
    <button class="active" data-panel="browse">Browse</button>
    <button data-panel="book">Book a Table</button>
    <button data-panel="mine">My Reservations</button>
  </nav>

  <main>
    <div id="statusBar">Connecting to API…</div>

    <section id="browse" class="panel active">
      <div class="toolbar">
        <label for="cuisineFilter" class="inline">Filter by cuisine:</label>
        <select id="cuisineFilter">
          <option value="">All cuisines</option>
        </select>
      </div>
      <div id="restaurantList" class="cards"></div>
    </section>

    <section id="book" class="panel">
      <div id="bookMessage"></div>
      <form id="bookForm" class="form-grid">
        <div>
          <label for="bookRestaurant">Restaurant</label>
          <select id="bookRestaurant" required></select>
        </div>
        <div>
          <label for="bookDate">Date</label>
          <select id="bookDate" required></select>
        </div>
        <div>
          <label for="bookTime">Time</label>
          <select id="bookTime" required></select>
        </div>
        <div>
          <label for="bookParty">Party size</label>
          <input type="number" id="bookParty" min="1" max="20" value="2" required>
        </div>
        <div>
          <label for="bookPreference">Seating preference (optional)</label>
          <input type="text" id="bookPreference" placeholder="e.g. patio, window">
        </div>
        <div>
          <label for="bookName">Your name</label>
          <input type="text" id="bookName" required>
        </div>
        <div>
          <label for="bookContact">Contact (phone or email)</label>
          <input type="text" id="bookContact">
        </div>
        <div class="form-actions">
          <button type="button" class="action secondary" id="checkAvailBtn">Check availability</button>
          <button type="submit" class="action">Book reservation</button>
        </div>
      </form>
      <div id="availResult"></div>
    </section>

    <section id="mine" class="panel">
      <div class="toolbar">
        <input type="text" id="searchName" placeholder="Enter your name">
        <button class="action" id="searchResBtn">Find reservations</button>
      </div>
      <div id="myReservations" class="cards"></div>
    </section>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
